<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="title desc">

<title id="title">Technology Stack</title>
<desc id="desc">Technology stack showing programming languages, frameworks, backend tools, data and AI technologies.</desc>

<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#070b16"/>
  <stop offset="1" stop-color="#101a2e"/>
 </linearGradient>

 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#247bff"/>
  <stop offset="1" stop-color="#ff354f"/>
 </linearGradient>

 <pattern id="dots" width="22" height="22"
          patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="1" fill="#8ba6d7" opacity=".18"/>
 </pattern>

 <style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .display {
   font-weight: 800;
   letter-spacing: -1.4px;
   fill: #f4f7ff;
  }
  .mono {
   font-family: monospace;
   font-size: 15px;
   letter-spacing: 1.2px;
   fill: #83b4ff;
  }
  .chip { font-size: 16px; fill: #e9efff; }
 </style>
</defs>

<!-- Original background and border -->
<rect width="1200" height="430" rx="22" fill="url(#bg)"/>
<rect width="1200" height="430" rx="22" fill="url(#dots)"/>
<path d="M0 7H1200" stroke="url(#edge)" stroke-width="7"/>
<rect x="20" y="20" width="1160" height="390"
      rx="18" fill="none" stroke="#293752"/>

<!-- Original heading -->
<text x="52" y="61" class="mono">02 / TECHNOLOGY STACK</text>
<text x="52" y="112" class="display" font-size="40">Tools I build with</text>

<!-- Original orbital design, moved down and right -->
<g transform="translate(600,245)">

 <ellipse rx="235" ry="45"
          fill="none" stroke="#247bff" stroke-width="2"
          opacity=".65" transform="rotate(-19)"/>

 <ellipse rx="235" ry="45"
          fill="none" stroke="#ff354f" stroke-width="2"
          opacity=".55" transform="rotate(19)"/>

 <ellipse rx="195" ry="73"
          fill="none" stroke="#607ba9" stroke-width="1.5"
          opacity=".7"/>

 <!-- Center -->
 <circle cx="0" cy="0" r="48"
         fill="#111e33" stroke="url(#edge)" stroke-width="2"/>

 <text x="0" y="-4" text-anchor="middle"
       class="display" font-size="20">BUILD</text>

 <text x="0" y="19" text-anchor="middle"
       class="mono">+ LEARN</text>

 <!-- Technology chips -->
 <g>
  <rect x="-225" y="-16" width="100" height="32"
        rx="9" fill="#111e33" stroke="#247bff"/>
  <text x="-175" y="6" text-anchor="middle" class="chip">Python</text>
 </g>

 <g>
  <rect x="-125" y="-67" width="100" height="32"
        rx="9" fill="#111e33" stroke="#ff354f"/>
  <text x="-75" y="-45" text-anchor="middle" class="chip">Java</text>
 </g>

 <g>
  <rect x="25" y="-67" width="125" height="32"
        rx="9" fill="#111e33" stroke="#247bff"/>
  <text x="87.5" y="-45" text-anchor="middle"
        class="chip">JavaScript</text>
 </g>

 <g>
  <rect x="125" y="-16" width="100" height="32"
        rx="9" fill="#111e33" stroke="#ff354f"/>
  <text x="175" y="6" text-anchor="middle" class="chip">React</text>
 </g>

 <g>
  <rect x="60" y="48" width="115" height="32"
        rx="9" fill="#111e33" stroke="#247bff"/>
  <text x="117.5" y="70" text-anchor="middle"
        class="chip">Node.js</text>
 </g>

 <g>
  <rect x="-175" y="48" width="110" height="32"
        rx="9" fill="#111e33" stroke="#ff354f"/>
  <text x="-120" y="70" text-anchor="middle"
        class="chip">FastAPI</text>
 </g>
</g>

<!-- Original bottom categories -->
<g transform="translate(55,355)">

 <text x="0" y="0" class="mono">BACKEND</text>
 <text x="0" y="27" class="chip">Node.js · Express · FastAPI</text>

 <text x="370" y="0" class="mono">DATA &amp; AI</text>
 <text x="370" y="27" class="chip">MongoDB · Machine Learning · Streamlit</text>

 <text x="805" y="0" class="mono">CORE TOOLS</text>
 <text x="805" y="27" class="chip">Git · GitHub</text>

</g>
</svg>